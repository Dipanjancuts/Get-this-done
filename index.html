<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>Phone To-Do Widget</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .task-enter {
      animation: slideIn 0.18s ease-out forwards;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 transition-colors duration-200 bg-slate-100 text-slate-900">
  <main id="widgetCard" class="w-full max-w-[400px] rounded-[28px] shadow-xl border overflow-hidden transition-colors duration-200 bg-white border-slate-200/80">
    <!-- Top Widget Header -->
    <header class="px-5 pt-5 pb-4 border-b transition-colors duration-200 border-slate-100" id="widgetHeader">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p id="dateLabel" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Today</p>
          <h1 class="text-xl font-bold tracking-tight mt-0.5">To-Do</h1>
        </div>
        <div class="flex items-center gap-2">
          <div id="progressBadge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-600">
            0/0 done
          </div>
          <button id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme"
            class="w-9 h-9 rounded-full flex items-center justify-center transition-colors bg-slate-100 hover:bg-slate-200 text-slate-600">
            <svg id="themeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="mt-3.5 h-1.5 w-full rounded-full overflow-hidden bg-slate-100" id="progressTrack">
        <div id="progressBar" class="h-full rounded-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- Filter Tabs -->
      <div class="mt-3.5 flex items-center gap-1.5" role="tablist" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors">All</button>
        <button type="button" data-filter="active" class="filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors">Active</button>
        <button type="button" data-filter="done" class="filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors">Done</button>
      </div>
    </header>

    <!-- Quick Add Form -->
    <form id="addForm" class="px-4 py-3 border-b flex items-center gap-2 border-slate-100" autocomplete="off">
      <button id="priorityToggle" type="button" title="Cycle priority" aria-label="Cycle priority"
        class="w-8 h-8 shrink-0 rounded-full flex items-center justify-center border transition-colors border-slate-200 bg-slate-50">
        <span id="priorityDot" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
      </button>
      <input id="taskInput" type="text" maxlength="140" placeholder="Add a quick task..."
        class="flex-1 min-w-0 bg-transparent text-sm py-1.5 px-1 outline-none placeholder:text-slate-400" />
      <button type="submit" aria-label="Add task"
        class="w-9 h-9 shrink-0 rounded-xl bg-slate-900 text-white hover:bg-slate-800 active:scale-95 transition flex items-center justify-center font-semibold shadow-sm" id="addBtn">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </form>

    <!-- Task List -->
    <ul id="taskList" class="divide-y max-h-[360px] overflow-y-auto custom-scroll divide-slate-100" aria-live="polite"></ul>

    <!-- Empty State -->
    <div id="emptyState" class="hidden px-6 py-10 text-center">
      <div class="w-10 h-10 rounded-2xl mx-auto mb-2.5 flex items-center justify-center bg-slate-100 text-slate-400" id="emptyIconWrap">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"></polyline>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
      </div>
      <p id="emptyText" class="text-sm font-medium text-slate-500">Nothing here yet</p>
      <p class="text-xs text-slate-400 mt-0.5">Type above and tap + to add a task.</p>
    </div>

    <!-- Footer Controls -->
    <footer id="widgetFooter" class="px-5 py-3 border-t flex items-center justify-between text-xs border-slate-100 text-slate-500">
      <span id="leftCount">0 left</span>
      <div class="flex items-center gap-3">
        <button id="copyBtn" type="button" class="font-medium hover:underline transition-colors">Copy list</button>
        <button id="clearDoneBtn" type="button" class="font-medium text-rose-500 hover:underline transition-colors disabled:opacity-35 disabled:no-underline">Clear done</button>
      </div>
    </footer>
  </main>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-xs font-medium shadow-lg bg-slate-900 text-white opacity-0 pointer-events-none transition-opacity duration-200">
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'phone_todo_widget_v1';
      const THEME_KEY = 'phone_todo_widget_theme_v1';

      const PRIORITIES = ['normal', 'high', 'low'];
      const PRIORITY_META = {
        high: { dot: 'bg-rose-500', label: 'High priority' },
        normal: { dot: 'bg-slate-400', label: 'Normal priority' },
        low: { dot: 'bg-sky-400', label: 'Low priority' }
      };

      const DEFAULT_TASKS = [
        { id: 't1', text: 'Reply to morning messages', done: false, priority: 'high' },
        { id: 't2', text: 'Pick up groceries on the way home', done: false, priority: 'normal' },
        { id: 't3', text: '20-minute evening walk', done: true, priority: 'low' }
      ];

      let tasks = loadTasks();
      let filter = 'all';
      let currentPriority = 'normal';
      let theme = loadTheme();
      let editingId = null;
      let toastTimer = null;

      const body = document.body;
      const widgetCard = document.getElementById('widgetCard');
      const widgetHeader = document.getElementById('widgetHeader');
      const widgetFooter = document.getElementById('widgetFooter');
      const addForm = document.getElementById('addForm');
      const taskInput = document.getElementById('taskInput');
      const addBtn = document.getElementById('addBtn');
      const priorityToggle = document.getElementById('priorityToggle');
      const priorityDot = document.getElementById('priorityDot');
      const taskList = document.getElementById('taskList');
      const emptyState = document.getElementById('emptyState');
      const emptyText = document.getElementById('emptyText');
      const emptyIconWrap = document.getElementById('emptyIconWrap');
      const progressBadge = document.getElementById('progressBadge');
      const progressTrack = document.getElementById('progressTrack');
      const progressBar = document.getElementById('progressBar');
      const leftCount = document.getElementById('leftCount');
      const clearDoneBtn = document.getElementById('clearDoneBtn');
      const copyBtn = document.getElementById('copyBtn');
      const themeBtn = document.getElementById('themeBtn');
      const themeIcon = document.getElementById('themeIcon');
      const dateLabel = document.getElementById('dateLabel');
      const filterTabs = document.querySelectorAll('.filter-tab');
      const toast = document.getElementById('toast');

      function loadTasks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw !== null) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return DEFAULT_TASKS.slice();
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {}
      }

      function loadTheme() {
        try {
          const saved = localStorage.getItem(THEME_KEY);
          if (saved === 'dark' || saved === 'light') return saved;
        } catch (e) {}
        return 'light';
      }

      function saveTheme() {
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (e) {}
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0');
        }, 1800);
      }

      function setFormattedDate() {
        try {
          const now = new Date();
          dateLabel.textContent = now.toLocaleDateString(undefined, {
            weekday: 'short',
            month: 'short',
            day: 'numeric'
          });
        } catch (e) {
          dateLabel.textContent = 'Today';
        }
      }

      function applyTheme() {
        const isDark = theme === 'dark';
        body.className = isDark
          ? 'min-h-screen flex items-center justify-center p-3 sm:p-6 transition-colors duration-200 bg-slate-950 text-slate-100'
          : 'min-h-screen flex items-center justify-center p-3 sm:p-6 transition-colors duration-200 bg-slate-100 text-slate-900';

        widgetCard.className = isDark
          ? 'w-full max-w-[400px] rounded-[28px] shadow-2xl border overflow-hidden transition-colors duration-200 bg-slate-900 border-slate-800'
          : 'w-full max-w-[400px] rounded-[28px] shadow-xl border overflow-hidden transition-colors duration-200 bg-white border-slate-200/80';

        widgetHeader.className = isDark
          ? 'px-5 pt-5 pb-4 border-b transition-colors duration-200 border-slate-800'
          : 'px-5 pt-5 pb-4 border-b transition-colors duration-200 border-slate-100';

        addForm.className = isDark
          ? 'px-4 py-3 border-b flex items-center gap-2 border-slate-800'
          : 'px-4 py-3 border-b flex items-center gap-2 border-slate-100';

        priorityToggle.className = isDark
          ? 'w-8 h-8 shrink-0 rounded-full flex items-center justify-center border transition-colors border-slate-700 bg-slate-800'
          : 'w-8 h-8 shrink-0 rounded-full flex items-center justify-center border transition-colors border-slate-200 bg-slate-50';

        addBtn.className = isDark
          ? 'w-9 h-9 shrink-0 rounded-xl bg-emerald-500 text-slate-950 hover:bg-emerald-400 active:scale-95 transition flex items-center justify-center font-semibold shadow-sm'
          : 'w-9 h-9 shrink-0 rounded-xl bg-slate-900 text-white hover:bg-slate-800 active:scale-95 transition flex items-center justify-center font-semibold shadow-sm';

        taskList.className = isDark
          ? 'divide-y max-h-[360px] overflow-y-auto custom-scroll divide-slate-800/80'
          : 'divide-y max-h-[360px] overflow-y-auto custom-scroll divide-slate-100';

        widgetFooter.className = isDark
          ? 'px-5 py-3 border-t flex items-center justify-between text-xs border-slate-800 text-slate-400'
          : 'px-5 py-3 border-t flex items-center justify-between text-xs border-slate-100 text-slate-500';

        progressTrack.className = isDark
          ? 'mt-3.5 h-1.5 w-full rounded-full overflow-hidden bg-slate-800'
          : 'mt-3.5 h-1.5 w-full rounded-full overflow-hidden bg-slate-100';

        themeBtn.className = isDark
          ? 'w-9 h-9 rounded-full flex items-center justify-center transition-colors bg-slate-800 hover:bg-slate-700 text-amber-300'
          : 'w-9 h-9 rounded-full flex items-center justify-center transition-colors bg-slate-100 hover:bg-slate-200 text-slate-600';

        emptyIconWrap.className = isDark
          ? 'w-10 h-10 rounded-2xl mx-auto mb-2.5 flex items-center justify-center bg-slate-800 text-slate-500'
          : 'w-10 h-10 rounded-2xl mx-auto mb-2.5 flex items-center justify-center bg-slate-100 text-slate-400';

        themeIcon.innerHTML = isDark
          ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
          : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }

      function renderPriorityIndicator() {
        const meta = PRIORITY_META[currentPriority] || PRIORITY_META.normal;
        priorityDot.className = 'w-2.5 h-2.5 rounded-full ' + meta.dot;
        priorityToggle.setAttribute('title', meta.label + ' (tap to change)');
      }

      function renderTabs() {
        const isDark = theme === 'dark';
        filterTabs.forEach(tab => {
          const active = tab.dataset.filter === filter;
          if (active) {
            tab.className = isDark
              ? 'filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors bg-slate-800 text-white'
              : 'filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors bg-slate-900 text-white';
          } else {
            tab.className = isDark
              ? 'filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors text-slate-400 hover:bg-slate-800/60'
              : 'filter-tab flex-1 py-1.5 text-xs font-semibold rounded-xl transition-colors text-slate-500 hover:bg-slate-100';
          }
        });
      }

      function getFilteredTasks() {
        if (filter === 'active') return tasks.filter(t => !t.done);
        if (filter === 'done') return tasks.filter(t => t.done);
        return tasks;
      }

      function render() {
        applyTheme();
        renderPriorityIndicator();
        renderTabs();

        const total = tasks.length;
        const doneCount = tasks.filter(t => t.done).length;
        const activeCount = total - doneCount;
        const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);

        progressBadge.textContent = doneCount + '/' + total + ' done';
        progressBar.style.width = pct + '%';
        leftCount.textContent = activeCount + (activeCount === 1 ? ' task left' : ' tasks left');
        clearDoneBtn.disabled = doneCount === 0;

        const visible = getFilteredTasks();
        taskList.innerHTML = '';

        if (visible.length === 0) {
          emptyState.classList.remove('hidden');
          emptyText.textContent = filter === 'done'
            ? 'No completed tasks yet'
            : filter === 'active' && total > 0
              ? 'All caught up!'
              : 'Nothing here yet';
          return;
        }
        emptyState.classList.add('hidden');

        const isDark = theme === 'dark';

        visible.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task-enter px-4 py-3 flex items-center gap-3 group transition-colors ' +
            (isDark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50/80');
          li.dataset.id = task.id;

          // Checkbox button
          const checkBtn = document.createElement('button');
          checkBtn.type = 'button';
          checkBtn.setAttribute('aria-label', task.done ? 'Mark incomplete' : 'Mark complete');
          checkBtn.className = 'w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center transition-all active:scale-90 ' +
            (task.done
              ? 'bg-emerald-500 border-emerald-500 text-white'
              : (isDark ? 'border-slate-600 hover:border-emerald-400' : 'border-slate-300 hover:border-emerald-500'));
          checkBtn.innerHTML = task.done
            ? '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
            : '';
          checkBtn.addEventListener('click', () => toggleTask(task.id));

          // Priority dot
          const dotBtn = document.createElement('button');
          dotBtn.type = 'button';
          dotBtn.title = (PRIORITY_META[task.priority] || PRIORITY_META.normal).label;
          dotBtn.setAttribute('aria-label', 'Change task priority');
          dotBtn.className = 'w-2 h-2 shrink-0 rounded-full transition-transform hover:scale-125 ' +
            (PRIORITY_META[task.priority] || PRIORITY_META.normal).dot;
          dotBtn.addEventListener('click', () => cycleTaskPriority(task.id));

          // Task text or edit input
          const contentWrap = document.createElement('div');
          contentWrap.className = 'flex-1 min-w-0';

          if (editingId === task.id) {
            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.value = task.text;
            editInput.maxLength = 140;
            editInput.className = 'w-full text-sm bg-transparent border-b outline-none py-0.5 ' +
              (isDark ? 'border-emerald-400 text-white' : 'border-slate-900 text-slate-900');

            const commitEdit = () => {
              const trimmed = editInput.value.trim();
              if (trimmed) {
                task.text = trimmed;
                saveTasks();
              }
              editingId = null;
              render();
            };

            editInput.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') commitEdit();
              if (e.key === 'Escape') {
                editingId = null;
                render();
              }
            });
            editInput.addEventListener('blur', commitEdit);
            contentWrap.appendChild(editInput);
            setTimeout(() => editInput.focus(), 0);
          } else {
            const span = document.createElement('span');
            span.textContent = task.text;
            span.className = 'block text-sm leading-snug break-words cursor-pointer select-none ' +
              (task.done
                ? (isDark ? 'line-through text-slate-500' : 'line-through text-slate-400')
                : (isDark ? 'text-slate-100' : 'text-slate-800'));
            span.title = 'Tap to toggle, double-tap to edit';
            span.addEventListener('click', () => toggleTask(task.id));
            span.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              editingId = task.id;
              render();
            });
            contentWrap.appendChild(span);
          }

          // Delete button
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.setAttribute('aria-label', 'Delete task');
          delBtn.className = 'w-7 h-7 shrink-0 rounded-lg flex items-center justify-center transition-colors opacity-60 hover:opacity-100 ' +
            (isDark ? 'text-slate-400 hover:bg-slate-800 hover:text-rose-400' : 'text-slate-400 hover:bg-slate-100 hover:text-rose-500');
          delBtn.innerHTML = '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
          delBtn.addEventListener('click', () => deleteTask(task.id));

          li.appendChild(checkBtn);
          li.appendChild(dotBtn);
          li.appendChild(contentWrap);
          li.appendChild(delBtn);
          taskList.appendChild(li);
        });
      }

      function addTask(text) {
        const clean = text.trim();
        if (!clean) return;
        tasks.unshift({
          id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          text: clean,
          done: false,
          priority: currentPriority
        });
        saveTasks();
        render();
      }

      function toggleTask(id) {
        const item = tasks.find(t => t.id === id);
        if (!item) return;
        item.done = !item.done;
        saveTasks();
        render();
      }

      function cycleTaskPriority(id) {
        const item = tasks.find(t => t.id === id);
        if (!item) return;
        const idx = PRIORITIES.indexOf(item.priority);
        item.priority = PRIORITIES[(idx + 1) % PRIORITIES.length];
        saveTasks();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
      }

      addForm.addEventListener('submit', (e) => {
        e.preventDefault();
        addTask(taskInput.value);
        taskInput.value = '';
        taskInput.focus();
      });

      priorityToggle.addEventListener('click', () => {
        const idx = PRIORITIES.indexOf(currentPriority);
        currentPriority = PRIORITIES[(idx + 1) % PRIORITIES.length];
        renderPriorityIndicator();
        showToast(PRIORITY_META[currentPriority].label);
      });

      filterTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          filter = tab.dataset.filter;
          render();
        });
      });

      clearDoneBtn.addEventListener('click', () => {
        const before = tasks.length;
        tasks = tasks.filter(t => !t.done);
        if (tasks.length !== before) {
          saveTasks();
          render();
          showToast('Cleared completed tasks');
        }
      });

      copyBtn.addEventListener('click', () => {
        if (tasks.length === 0) {
          showToast('No tasks to copy');
          return;
        }
        const text = tasks
          .map(t => (t.done ? '[x] ' : '[ ] ') + t.text)
          .join('\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast('Copied list'))
            .catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Copied list');
        } catch (e) {
          showToast('Could not copy');
        }
      }

      themeBtn.addEventListener('click', () => {
        theme = theme === 'light' ? 'dark' : 'light';
        saveTheme();
        render();
      });

      setFormattedDate();
      render();
    })();
  </script>
</body>
</html>
